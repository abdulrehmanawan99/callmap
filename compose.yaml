name: callmap
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: callmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callmap_local_only}
      POSTGRES_DB: callmap
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["callmap_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callmap -d callmap"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.3-alpine
    ports: ["127.0.0.1:6382:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["callmap_redis:/data"]
volumes:
  callmap_pg:
  callmap_redis:
