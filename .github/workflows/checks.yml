name: Local workflow checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: callmap
          POSTGRES_PASSWORD: callmap_local_only
          POSTGRES_DB: callmap_test
        ports: ["55434:5432"]
        options: >-
          --health-cmd "pg_isready -U callmap -d callmap_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.3-alpine
        ports: ["6382:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest api/tests -q
        env:
          CALLMAP_TEST_DATABASE_URL: postgresql://callmap:callmap_local_only@127.0.0.1:55434/callmap_test
          REDIS_URL: redis://127.0.0.1:6382/0
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: web
      - name: Static checks and secret patterns
        run: |
          python -m compileall -q api scripts
          python scripts/check_secrets.py --include-build
      - name: Isolated Python security audit
        run: |
          python -m venv /tmp/callmap-audit
          /tmp/callmap-audit/bin/pip install pip-audit==2.10.1 bandit==1.9.4
          /tmp/callmap-audit/bin/pip-audit --disable-pip --no-deps -r requirements.lock
          /tmp/callmap-audit/bin/bandit -r api scripts -ll
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser fixture workflow with real persistence
        env:
          DATABASE_URL: postgresql://callmap:callmap_local_only@127.0.0.1:55434/callmap_test
          REDIS_URL: redis://127.0.0.1:6382/0
          CALLMAP_DATA_DIR: .local/browser-audio
          CALLMAP_LOCAL_TOKEN: ci-browser-fixture-only
          CALLMAP_TEST_TOKEN: ci-browser-fixture-only
          CALLMAP_PROVIDER: fixture
          GEMINI_API_KEY: ''
        run: |
          set -euo pipefail
          api_pid='' worker_pid='' web_pid=''
          cleanup() {
            for pid in "$api_pid" "$worker_pid" "$web_pid"; do
              if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
            done
            for pid in "$api_pid" "$worker_pid" "$web_pid"; do
              if [ -n "$pid" ]; then wait "$pid" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT
          python -c 'from api.core import migrate; migrate()'
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8012 --no-access-log > callmap-api-test.log 2>&1 &
          api_pid=$!
          python -m api.worker > callmap-worker-test.log 2>&1 &
          worker_pid=$!
          (cd web && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5175 --strictPort) > callmap-web-test.log 2>&1 &
          web_pid=$!
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8012/api/health > /dev/null && curl --fail --silent http://127.0.0.1:5175 > /dev/null; then break; fi
            if ! kill -0 "$api_pid" "$worker_pid" "$web_pid" 2>/dev/null; then
              cat callmap-api-test.log callmap-worker-test.log callmap-web-test.log
              exit 1
            fi
            sleep 1
          done
          npm run test:browser --prefix web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence
          path: .local/browser
          if-no-files-found: ignore
